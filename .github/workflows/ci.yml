name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Both jobs run the fast tier (FAITHFUL_FAST=1 leaves out the heavy and timing-sensitive suites listed in vitest.config.ts:
# red-team, corpus, Z3 and benchmark tests, which do not finish within their budgets or are not reliable on a shared hosted runner). The full suite is `pnpm test`
# on a local machine, and the "heavy" workflow by hand. CI runs Node 22, the oldest line `engines` allows.
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env: { FAITHFUL_SKIP_LEAN: '1', FAITHFUL_FAST: '1' }
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: leanprover/lean-action@v1
        with: { lake-package-directory: lean, build: false, test: false, use-github-cache: true }
      - run: pnpm install --frozen-lockfile
      - run: cd lean && lake exe cache get && lake build
      - run: pnpm build
      - run: pnpm test
        env: { FAITHFUL_FAST: '1' }
